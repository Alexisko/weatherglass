<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weatherglass — Climate Explorer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Atmospheric background layers -->
  <div class="atmosphere" aria-hidden="true">
    <div class="atm-layer atm-layer--blue"></div>
    <div class="atm-layer atm-layer--amber"></div>
    <div class="atm-layer atm-layer--deep"></div>
    <div class="atm-grain"></div>
  </div>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header__brand">
        <svg class="header__hex" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <polygon points="9,1 16.5,5 16.5,13 9,17 1.5,13 1.5,5" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <polygon points="9,4.5 13.5,7 13.5,12 9,14.5 4.5,12 4.5,7" fill="currentColor" opacity="0.2"/>
        </svg>
        <span>Weatherglass</span>
      </div>
      <div class="header__tagline">Climate · Explorer</div>
    </header>

    <!-- Main -->
    <main class="main" id="main">

      <!-- ── Search Hero ─────────────────────────────────── -->
      <section class="hero" id="hero">

        <div class="hero__headline">
          <p class="hero__eyebrow">Where do you want to explore?</p>
          <h1 class="hero__title">
            <span class="hero__title-line">Climate</span>
            <span class="hero__title-line hero__title-line--italic">in detail</span>
          </h1>
        </div>

        <div class="search-block">

          <!-- Search input -->
          <div class="search-wrap">
            <div class="search-field" id="searchField">
              <svg class="search-field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
                <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input
                type="text"
                id="locationInput"
                class="search-field__input"
                placeholder="City, region, or country…"
                autocomplete="off"
                spellcheck="false"
                aria-label="Location search"
                aria-autocomplete="list"
                aria-controls="suggestions"
                aria-expanded="false"
              >
            </div>

            <!-- Suggestions dropdown -->
            <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
          </div>

          <!-- Selected location reveal -->
          <div class="location-card" id="locationCard" hidden>
            <div class="location-card__name" id="locationName"></div>
            <div class="location-card__meta" id="locationMeta"></div>
          </div>

          <!-- Explore button -->
          <button class="explore-btn" id="exploreBtn" hidden>
            <span class="explore-btn__label">Explore Climate</span>
            <span class="explore-btn__arrow" aria-hidden="true">→</span>
          </button>

        </div><!-- /search-block -->
      </section>

      <!-- ── Results ─────────────────────────────────────── -->
      <section class="results" id="results" hidden>

        <!-- Loading state -->
        <div class="results__loading" id="resultsLoading" hidden>
          <div class="pulse-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <p class="results__loading-text">Fetching climate data<span class="ellipsis"></span></p>
        </div>

        <!-- Content -->
        <div class="results__content" id="resultsContent" hidden>

          <!-- Location + date range banner -->
          <div class="results__banner" id="resultsBanner"></div>

          <!-- Period selector -->
          <div class="time-picker" id="timePicker">
            <div class="time-picker__label">Period</div>
            <div class="time-picker__groups">

              <div class="time-picker__row">
                <button class="time-opt time-opt--wide active" data-type="annual">Annual</button>
              </div>

              <div class="time-picker__row">
                <span class="time-picker__group-label">Quarter</span>
                <button class="time-opt" data-type="quarter" data-value="1">Q1 <em>Jan–Mar</em></button>
                <button class="time-opt" data-type="quarter" data-value="2">Q2 <em>Apr–Jun</em></button>
                <button class="time-opt" data-type="quarter" data-value="3">Q3 <em>Jul–Sep</em></button>
                <button class="time-opt" data-type="quarter" data-value="4">Q4 <em>Oct–Dec</em></button>
              </div>

              <div class="time-picker__row">
                <span class="time-picker__group-label">Month</span>
                <button class="time-opt" data-type="month" data-value="1">Jan</button>
                <button class="time-opt" data-type="month" data-value="2">Feb</button>
                <button class="time-opt" data-type="month" data-value="3">Mar</button>
                <button class="time-opt" data-type="month" data-value="4">Apr</button>
                <button class="time-opt" data-type="month" data-value="5">May</button>
                <button class="time-opt" data-type="month" data-value="6">Jun</button>
                <button class="time-opt" data-type="month" data-value="7">Jul</button>
                <button class="time-opt" data-type="month" data-value="8">Aug</button>
                <button class="time-opt" data-type="month" data-value="9">Sep</button>
                <button class="time-opt" data-type="month" data-value="10">Oct</button>
                <button class="time-opt" data-type="month" data-value="11">Nov</button>
                <button class="time-opt" data-type="month" data-value="12">Dec</button>
              </div>

            </div>
          </div>

          <!-- KPI strip -->
          <div class="kpi-strip" id="kpiStrip"></div>

          <!-- Charts grid -->
          <div class="charts-grid" id="chartsGrid"></div>

        </div>

        <!-- Error state -->
        <div class="results__error" id="resultsError" hidden>
          <p class="results__error-msg" id="resultsErrorMsg"></p>
          <button class="results__retry" id="retryBtn">Try again</button>
        </div>

      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Data — Open-Meteo Climate API</span>
      <span class="footer__dot">·</span>
      <span>No API key required</span>
      <span class="footer__dot">·</span>
      <span>Free &amp; open source</span>
    </footer>

  </div><!-- /app -->

  <script src="app.js"></script>
</body>
</html>
